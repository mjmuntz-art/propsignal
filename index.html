<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* NBAPropSignal board — PropSignal family (shared palette with NFLPropSignal). */
:root{
  --bg:#0F141B;--bg2:#0B1016;--panel:#18202A;--panel2:#1E2733;--panel3:#243041;--line:#2A3542;--line2:#38485B;
  --ink:#EEF2F6;--ink2:#B4BECB;--ink3:#7E8A99;--dim:#5F6B7A;
  /* NBAPropSignal blue (accent) + win green (results only) */
  --acc:#6F94FF;--acc-bg:#172340;--acc-line:#3A55A0;--acc-ink:#0B1530;
  --mint:#3DBB86;--mint-bg:#122A21;--mint-line:#2C6A51;
  --neg:#F06A57;--neg-bg:#2A1611;--neg-line:#6B3A2E;
  --amber:#E3A847;--amber-bg:#1E190A;--amber-line:#5C4A1E;--gold:#E8B64C;--blue:#6F94FF;
  --disp:'Barlow Condensed',system-ui,sans-serif;--text:'Barlow',system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.n{font-family:var(--disp);font-variant-numeric:tabular-nums}
.pos{color:var(--mint)}.neg{color:var(--neg)}.mut{color:var(--ink2)}.dim{color:var(--dim)}.amb{color:var(--amber)}
.wrap{max-width:1180px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 110px max(16px,env(safe-area-inset-left))}
.eyebrow{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink3);font-weight:600}
h1,h2,h3{margin:0;text-wrap:balance}

/* header + nav */
.top{position:sticky;top:0;z-index:40;background:rgba(10,15,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:8px 28px;min-height:58px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.brand{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:.2px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.brand i{font-style:normal;color:var(--acc)}
.nav{display:flex;gap:22px}
.nav button{background:none;border:0;color:var(--ink2);font-weight:500;font-size:14px;padding:18px 0 16px;border-bottom:2px solid transparent;cursor:pointer}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--acc)}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.stat{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--mint);box-shadow:0 0 0 3px var(--mint-bg)}.dot.warn{background:var(--amber)}.dot.bad{background:var(--neg)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;color:var(--ink2)}
.iconbtn:hover{color:var(--ink)}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabbar{display:none}
@media (max-width:760px){
  .nav,.stat .lbl{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(13,20,27,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--ink3);padding:4px 0;cursor:pointer}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--acc)}
}

/* controls */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.sortlab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.sortbox{display:flex;align-items:center;gap:10px}.sortbox .sortlab{margin-left:0}.sortbox.pso{margin-left:auto}
@media(max-width:640px){.sortbox.pso{margin-left:0;width:100%}.bar .search{width:100%}}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;padding:3px;background:var(--panel)}
.seg button{border:0;background:none;color:var(--ink2);font-size:13px;font-weight:600;padding:7px 13px;border-radius:7px;cursor:pointer;white-space:nowrap}
@media(max-width:520px){.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{font-size:12px;padding:7px 8px}}
.seg button[aria-pressed="true"]{background:var(--panel3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.seg.mint button[aria-pressed="true"]{background:var(--acc-bg);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc-line)}
.search{flex:1;min-width:170px;max-width:300px;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font:inherit}

/* page head (Slate-style editorial header) */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin:6px 0 16px}
.ph h1{font-family:var(--disp);font-weight:800;font-size:44px;line-height:.95;letter-spacing:.2px}
.ph h1 small{display:block;font-size:14px;font-family:var(--text);font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);font-size:12.5px;color:var(--ink2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.chip.mint{border-color:var(--acc-line);background:var(--acc-bg);color:var(--acc)}
.chip.mint b{color:var(--acc)}
.chip.amb{border-color:var(--amber-line);background:var(--amber-bg);color:var(--amber)}
.chip.neg{border-color:var(--neg-line);background:var(--neg-bg);color:var(--neg)}

/* play cards */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:900px){.cards{grid-template-columns:1fr}}
/* P38.3: three across on wide screens (six plays = two even rows), two
   across on mid screens; a short last row is centered so nothing hangs. */
@media (min-width:1180px){
  .cards{grid-template-columns:repeat(6,minmax(0,1fr))}
  .cards>.pc{grid-column:span 2}
  .cards.r1>.pc:last-child{grid-column:3/span 2}
  .cards.r2>.pc:nth-last-child(2){grid-column:2/span 2}
  .cards.r2>.pc:last-child{grid-column:4/span 2}
  .cards .pc-hero .who{left:128px}
  .cards .pc-hero .nm{font-size:24px}
  .cards .why{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards .tiles2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wrap,.topin{max-width:1400px}
}
@media (min-width:901px) and (max-width:1179px){
  .cards{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cards>.pc{grid-column:span 2}
  .cards.odd>.pc:last-child{grid-column:2/span 2}
}
}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pc.pending{border-style:dashed;border-color:var(--line2)}
.pc.void{opacity:.55}
.pc-hero{position:relative;height:118px;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 55%,#0F141B) 0%,color-mix(in srgb,var(--tc) 22%,#0F141B) 55%,#141B24 100%);overflow:hidden}
.pc-hero .court{position:absolute;inset:0;width:100%;height:100%;opacity:.13}
.pc-hero .wm{position:absolute;right:-26px;top:-18px;width:150px;height:150px;opacity:.18}
.pc-hero .hs{position:absolute;left:14px;bottom:-4px;height:118px;width:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.pc-hero .lg{position:absolute;left:14px;top:12px;width:38px;height:38px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.pc-hero .lg.solo{width:70px;height:70px;top:24px}
.pc-hero .who{position:absolute;left:150px;right:14px;bottom:12px}
.pc-hero .nm{font-family:var(--disp);font-weight:800;font-size:27px;line-height:1;text-shadow:0 1px 8px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-hero .mt{font-size:12.5px;color:rgba(232,238,242,.78);margin-top:3px}
.pc-hero .tl{position:absolute;top:10px;right:12px;display:flex;gap:6px}
.badge{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.6px;padding:3px 9px;border-radius:999px;background:rgba(10,15,20,.72);border:1px solid rgba(255,255,255,.14);color:var(--ink)}
.badge.lock{color:var(--acc);border-color:var(--acc-line)}
.badge.open{color:var(--amber);border-color:var(--amber-line)}
.badge.live{background:var(--neg);border-color:var(--neg);color:#fff;display:inline-flex;align-items:center;gap:5px}
.badge.live i{width:6px;height:6px;border-radius:50%;background:#fff;display:inline-block}
@media (prefers-reduced-motion:no-preference){.badge.live i{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}}
.badge.out{background:var(--neg-bg);color:var(--neg);border-color:var(--neg-line)}
.pc-body{padding:14px 16px 6px}
/* P39: card A2 — team column + name panel, pick bar with a solid edge block, stat row */
.pa-top{display:grid;grid-template-columns:132px minmax(0,1fr);min-height:142px}
.pa-col{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--tc),color-mix(in srgb,var(--tc) 62%,#000))}
.pa-col:after{content:'';position:absolute;right:0;top:0;bottom:0;width:5px;background:var(--tc2,var(--acc))}
.pa-col .wm{position:absolute;left:-26px;top:-24px;width:150px;height:150px;opacity:.26}
.pa-col .hs{position:absolute;left:50%;transform:translateX(-52%);bottom:0;height:128px;width:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.pa-col .solo{position:absolute;left:50%;top:50%;transform:translate(-55%,-50%);width:84px;height:84px}
.pa-id{position:relative;padding:12px 14px 12px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 24%,#121A24),#121A24 85%);display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-width:0}
.pa-id .lg{position:absolute;right:12px;top:10px;width:46px;height:46px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.pa-tags{display:flex;flex-wrap:wrap;gap:6px;padding-right:52px}
.pa-tags .rk{font-family:var(--disp);font-weight:700;font-size:12.5px;letter-spacing:.7px;padding:2px 8px;border-radius:4px;background:var(--acc);color:var(--acc-ink);white-space:nowrap}
.pa-tags .badge{border-radius:4px;padding:2px 8px;font-size:12.5px}
.pa-nm{font-family:var(--disp);font-weight:800;font-size:28px;line-height:.92;text-transform:uppercase;letter-spacing:.2px;overflow-wrap:anywhere}
.pa-mt{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3);margin-top:5px}
.pa-mt b{color:var(--ink2);font-weight:600}
.pa-bar{display:grid;grid-template-columns:auto minmax(0,1fr) 92px;align-items:stretch;background:var(--bg2);border-top:3px solid var(--tc)}
.pa-pk{display:flex;align-items:center;gap:7px;padding:9px 12px;font-family:var(--disp);font-weight:800;font-size:27px;line-height:1;white-space:nowrap}
.pa-pk .d.over{color:var(--acc)}.pa-pk .d.under{color:var(--ink)}
.pa-pk small{font-size:15px;color:var(--ink2);font-weight:700}
.pa-pr{display:flex;align-items:center;gap:8px;padding:0 10px;border-left:1px solid var(--line);min-width:0}
.pa-pr b{font-family:var(--disp);font-weight:800;font-size:21px}
.pa-pr em{font-style:normal;font-size:11px;line-height:1.25;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pa-pr .dec{vertical-align:0}
.pa-ed{background:var(--acc);color:var(--acc-ink);padding:6px 10px;text-align:right;display:flex;flex-direction:column;justify-content:center}
.pa-ed .k{font-size:10px;letter-spacing:1px;font-weight:700}
.pa-ed .v{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1}
.pc.void .pa-ed{background:var(--line2);color:var(--ink2)}
.pa-st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.pa-st>div{padding:9px 11px;border-right:1px solid var(--line);min-width:0}.pa-st>div:last-child{border-right:0}
.pa-st .k{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);font-weight:600;white-space:nowrap}
.pa-st .v{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1.1}
.pa-st .v small{font-size:14px}
.pa-st .s{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .pc-body>.flags:first-child{margin-top:0}
.lv{background:var(--bg2);overflow:hidden;border-bottom:1px solid var(--line)}
.livebox:empty{display:none}
/* while a game is live or final the pre-game stats shrink to one slim line */
.pc.is-live .pa-st>div{padding:6px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:6px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
.pa-st .ks{display:none}.pc.is-live .pa-st .kl{display:none}.pc.is-live .pa-st .ks{display:inline}
.pc.is-live .pa-st .k{font-size:9.5px}.pc.is-live .pa-st .v{font-size:16px}.pc.is-live .pa-st .v small{font-size:11px}.pc.is-live .pa-st .s{display:none}
.lv-bug{display:grid;grid-template-columns:auto 1fr auto;align-items:stretch;border-bottom:1px solid var(--line);min-height:36px}
.lv-clk{background:var(--neg);color:#fff;font-family:var(--disp);font-weight:800;font-size:15px;padding:6px 11px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.lv-clk i{width:7px;height:7px;border-radius:50%;background:#fff;animation:lvp 1.2s infinite}
.lv-clk.fin{background:var(--line2);color:var(--ink)}
@keyframes lvp{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.lv-clk i{animation:none}}
.lv-sc{display:flex;align-items:stretch;min-width:0}
.lv-tm{display:flex;align-items:center;gap:7px;padding:0 11px;border-left:4px solid var(--c);font-family:var(--disp);font-weight:800}
.lv-tm span{color:var(--ink2);font-size:14px}.lv-tm b{font-size:19px}
.lv-min{display:flex;align-items:center;padding:0 11px;font-size:12px;color:var(--ink3);white-space:nowrap}
.lv-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:10px 12px 8px}
.lv-big{font-family:var(--disp);font-weight:800;font-size:48px;line-height:.85}.lv-big small{font-size:18px;color:var(--ink3);margin-left:4px}
.lv-st{font-family:var(--disp);font-weight:800;font-size:20px;line-height:1.1}.lv-st.pos{color:var(--mint)}.lv-st.neg{color:var(--neg)}.lv-st.amb{color:var(--amber)}
.lv-sub{font-size:12px;color:var(--ink3);margin-top:2px}.lv-sub b{color:var(--ink)}
.lv-steps{display:flex;gap:3px;padding:0 12px 12px}
.lv-steps i{flex:1;height:9px;border-radius:2px;background:var(--line)}.lv-steps i.on{background:var(--acc)}.lv-steps i.g{background:var(--mint)}.lv-steps i.r{background:var(--neg)}
.lv-note,.lv-wait{padding:10px 12px;font-size:12.5px;color:var(--ink3)}.lv-note.bad{color:var(--neg);font-weight:600}
@media (max-width:440px){.lv-tm{padding:0 8px}.lv-tm b{font-size:17px}.lv-clk{font-size:14px;padding:6px 9px}.lv-big{font-size:42px}}

.pa-col .wm{opacity:.42;filter:drop-shadow(0 0 1px rgba(255,255,255,.9)) drop-shadow(0 0 1px rgba(255,255,255,.6))}
/* P40: logo badge (always readable) + shared team column */
.lchip{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
/* P40.1: real logo colors, no badge; a thin white outline + soft glow keeps dark logos readable */
.lchip img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 1px rgba(255,255,255,.95)) drop-shadow(0 0 1px rgba(255,255,255,.95)) drop-shadow(0 0 6px rgba(255,255,255,.3))}
.lchip.pa{position:absolute;right:12px;top:8px;width:56px;height:56px}
.lchip.mid{position:absolute;left:50%;top:50%;transform:translate(-55%,-50%);width:58%;aspect-ratio:1}
.lchip.sm{width:32px;height:32px}
.tcol{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--tc),color-mix(in srgb,var(--tc) 62%,#000))}
.tcol:after{content:'';position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--tc2)}
.tcol .wm{position:absolute;left:-16%;top:-14%;width:86%;opacity:.42;filter:drop-shadow(0 0 1px rgba(255,255,255,.9)) drop-shadow(0 0 1px rgba(255,255,255,.6))}
.tcol .hs{position:absolute;left:50%;transform:translateX(-52%);bottom:0;height:90%;width:auto;filter:drop-shadow(0 3px 8px rgba(0,0,0,.4))}
.caps{font-family:var(--disp);font-weight:800;text-transform:uppercase;line-height:.95;letter-spacing:.2px}
/* results */
.day2{flex:0 0 auto;min-width:88px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;padding:0;display:flex;flex-direction:column;color:var(--ink2)}
.day2 .t{padding:7px 10px 5px;text-align:center}.day2 .dw{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600}
.day2 .dd{display:block;font-family:var(--disp);font-weight:800;font-size:19px;color:var(--ink);line-height:1.1}
.day2 .b{font-family:var(--disp);font-weight:800;font-size:15px;padding:3px 0;background:var(--line2);color:var(--ink2)}
.day2.up .b{background:var(--mint);color:#0B1016}.day2.down .b{background:var(--neg);color:#0B1016}
.day2[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.sbug{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:6px}
.sbug>div{padding:14px 18px;border-right:1px solid var(--line);min-width:0}.sbug>div:last-child{border-right:0}
.sbug .k{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);font-weight:600}
.sbug .big{font-family:var(--disp);font-weight:800;font-size:46px;line-height:1}
.sbug .v{font-family:var(--disp);font-weight:800;font-size:30px;line-height:1.1}.sbug .s{font-size:12px;color:var(--ink3)}
.ublk{display:inline-block;margin-left:10px;padding:2px 10px;border-radius:6px;font-family:var(--disp);font-weight:800;font-size:24px;vertical-align:8px;background:var(--line2);color:var(--ink)}
.ublk.up{background:var(--mint);color:#0B1016}.ublk.dn{background:var(--neg);color:#0B1016}

  function chart(p,games,nn){

      var col=h==='h'?'#3DBB86':h==='m'?'#F06A57':'#7A8996';

        '<text x="'+(cx+bw/2).toFixed(1)+'" y="'+(H-bot+13)+'" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity=".65">'+(x.venue==='A'?'@':'')+esc(x.opp)+'</text>'+
        '<text x="'+(cx+bw/2).toFixed(1)+'" y="'+(H-bot+25)+'" text-anchor="middle" font-size="9.5" fill="currentColor" fill-opacity=".45">'+esc((x.date||'').slice(5).replace('-','/').replace(/^0/,''))+'</text>';
    });

  // P41: live stats as a TV scorebug (clock + both teams in their colors),

      '<div class="lv-min">'+(l&&!l.dnp&&l.MIN!=null?l.MIN+' min':'')+'</div></div>';

      if(over){if(v>line){need=fin?'HIT':'Cleared it';c='pos';}else{need=fin?(v===line?'PUSH':'MISS'):'Needs '+(Math.floor(line)+1-v)+' more';c=fin?(v===line?'amb':'neg'):'';}}
      else{if(v>line){need=fin?'MISS':'Over the line';c='neg';}else{var cu=Math.ceil(line)-1-v;need=fin?(v===line?'PUSH':'HIT'):(cu<=0?'No room left':cu+' to spare');c=fin?(v===line?'amb':'pos'):(cu<=1?'amb':'pos');}}
    }
    // pace: current total scaled by minutes played vs projected minutes

    var blocks='';

  }

        '<p class="note" style="margin:6px 0 0">'+(Math.abs(diff)<0.75?'Right on what the model expected. The results match the edge it saw.':diff>0?'<b class="pos">'+diff.toFixed(1)+' wins above</b> what the model expected. Running hot: some of this will give back.':'<b class="neg">'+Math.abs(diff).toFixed(1)+' wins below</b> what the model expected. That is the luck side, not proof the model is broken'+(S.expN<40?', especially over '+S.expN+' plays':'')+'.')+'</p>'+

  // P36: shadow ranking — same pool of qualifying props, two ways to rank.

    if(!S||S.error||!S.lists||!S.days)return head+'<div class="card">'+expl+'<p class="note2">Starts filling after the first slate that locks with this update. Both cards are graded the next morning.</p></div></section>';

  // ---- P50: teammate out ----------------------------------------------------

    if(sp.games&&sp.games.length){
      h+='<div class="sh"><span>Games without '+esc(nm)+'</span><span>vs tonight’s '+(L==null?'line':L)+'</span></div><table class="tmg">'+sp.games.slice(0,8).map(function(g){var v=g[st],ou=v==null||L==null?'':v>L?'Over':v<L?'Under':'Push',win=ou===dir;
        return '<tr><td>'+esc(dayLabel(g.date,{month:'short',day:'numeric'}))+' · '+(g.v==='A'?'@ ':'vs ')+esc(g.opp||'')+'</td><td class="n">'+(g.min==null?'—':g.min)+' min</td><td class="n">'+(v==null?'—':v)+' '+esc(STAT[st]||st)+'</td><td class="'+(ou==='Push'||!ou?'':win?'pos':'neg')+'"><b>'+ou+'</b></td></tr>';}).join('')+'</table>';
    }
    var n=sp.wo.g;h+='<div class="avnote">'+(n<5?n+' game'+(n===1?'':'s')+' without '+esc(nm)+' · small sample, read it as a lean. ':'')+'Games he missed, not shared floor time.</div></div>';
    return h;
  }
  function tmoBoardRows(d){
    return boardRows(d).map(function(r){var T=tmoOf(r.playerId),m=tmoBest(T);if(!m)return null;var sp=m.cur,hh=tmoHits(sp.games,r.stat,r.line,r.direction);
      return {r:r,m:m,dm:tmoD(sp,'min'),ds:tmoD(sp,r.stat),hits:hh,key:r.playerId+'|'+r.stat+'|'+r.direction};}).filter(Boolean)
      .sort(function(a,b){return (b.dm==null?-99:b.dm)-(a.dm==null?-99:a.dm);});
  }
  function tmoBoardView(d){
    var L=tmoBoardRows(d);
    if(!L.length)return '<div class="empty">No props tonight with a rotation teammate ruled out and games to compare.</div>';
    return '<div class="tmb"><div class="tmr h"><div>Player · out tonight</div><div>G w/o</div><div>MIN</div><div>Stat</div><div>Pick</div><div>vs line</div></div>'+L.map(function(x){
      var r=x.r,hr=x.hits.n?x.hits.h/x.hits.n:null,open=state.tmoOpen===x.key;
      var cl=function(v){return v==null||v===0?'':v>0?'pos':'neg';};
      return '<div class="tmr'+(open?' on':'')+'" data-tmb="'+esc(x.key)+'" style="'+tv(r.team)+'"><div class="pn2">'+lchip(r.teamLogo,'sm')+'<span><b>'+esc(r.player)+'</b><small>'+esc(tmoLast(x.m.name))+'<i>'+esc(x.m.status||'OUT')+'</i></small></span></div><div class="n">'+x.m.cur.wo.g+'</div><div class="n '+cl(x.dm)+'">'+tmoF(x.dm)+'</div><div class="n '+(x.ds==null||x.ds===0?'':(r.direction==='Over'?x.ds>0:x.ds<0)?'pos':'neg')+'">'+tmoF(x.ds)+' '+esc(STAT[r.stat]||r.stat)+'</div><div>'+(r.direction==='Over'?'O':'U')+' '+(r.line==null?'—':r.line)+' '+esc((STAT[r.stat]||r.stat).toUpperCase())+'</div><div class="n '+(hr==null?'':hr>=0.6?'pos':hr<=0.4?'neg':'')+'">'+(x.hits.n?x.hits.h+' of '+x.hits.n:'—')+'</div></div>'+
        (open?'<div class="tmx">'+tmoBlock({playerId:r.playerId,stat:r.stat,line:r.line,direction:r.direction})+'</div>':'');}).join('')+'</div>'+
      '<p class="foot">“vs line” = how often he went '+'the way of tonight’s pick in games without that teammate. Tap a row for the full breakdown.</p>';
  }

  // ---- board ---------------------------------------------------------------
  function boardRows(d){
    var rows=d.board.rows.filter(function(r){if(state.boardStat!=='ALL'&&r.stat!==state.boardStat)return false;if(state.boardForm&&r.form==null)return false;if(state.boardOnly&&!(r.decision==='PLAY'||r.decision==='LEAN'||r.decision==='WATCH'))return false;if(state.q&&(r.player+' '+r.game).toLowerCase().indexOf(state.q)===-1)return false;return true;});
    var k=state.sort.k,dir=state.sort.d;rows.sort(function(a,b){var x=a[k],y=b[k];if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*dir;});return rows;
  }
  function callPill(r){
    var d=r.decision,why=String(r.reason||'');
    var ftag=r.formPick?' <span class="pill F">FORM SIX</span>':r.form!=null?' <span class="pill Fs">FORM '+r.form+'%</span>':'';
    return callPill0(r,d,why)+ftag;
  }
  function callPill0(r,d,why){
    if(d==='PLAY'||d==='LEAN')return '<span class="pill '+(d==='PLAY'?'P':'L')+'">'+d+'</span>';
    if(d==='WATCH')return '<span class="pill W">WATCH · '+(/NOT_IN_TOP/.test(why)?'NOT IN TOP '+(((state.data||{}).rules||{}).maxPlays||5):'EDGE TOO SMALL')+'</span>';
    var m=[[/MARKET_GATE|PRICE/,'PRICE'],[/GRADE_/,'GRADE'],[/LINE_FAR/,'LINE GAP'],[/ROLE_UP/,'ROLE UP'],[/LOW_MINUTES/,'MINUTES'],[/SAMPLE_/,'NEW TO TEAM'],[/XEP_INJURY|AVAILABILITY|IDENTITY/,'INJURY / STATUS'],[/NO_BOOK|NO_EDGE/,'NO PRICE'],[/STICKY/,'LINE GAP']];
    for(var i=0;i<m.length;i++)if(m[i][0].test(why))return '<span class="pill X">PASS · '+m[i][1]+'</span>';
    return '<span class="pill X">'+esc(d||'PASS')+'</span>';
  }
  function viewBoard(d){
    var cols=[['team','',''],['player','Player · game',''],['stat','Pick',''],['odds','Odds','hm'],['proj','Proj','hm'],['l10avg','L10','hm'],['grade','Grade','hm'],['edge','Edge',''],['decision','Call','']];
    var head='<tr>'+cols.map(function(c){var on=state.sort.k===c[0];return '<th data-k="'+c[0]+'"'+(c[2]?' class="'+c[2]+'"':'')+'>'+c[1]+(on&&c[1]?(state.sort.d>0?' ▲':' ▼'):'')+'</th>';}).join('')+'</tr>';
    var rows=boardRows(d);
    var body=rows.map(function(r){var e=r.edge,w=e==null?0:Math.min(90,Math.abs(e)*100*3.2);var on=r.decision==='PLAY'||r.decision==='LEAN';
      return '<tr class="'+(on?'hl':'')+'" style="'+tv(r.team)+'"><td>'+lchip(r.teamLogo,'sm')+'</td><td><div class="pn">'+esc(r.player)+'</div><div class="g">'+esc(r.game)+(r.tip?' · '+esc(r.tip):'')+'</div></td>'+
        '<td><b>'+(r.direction==='Over'?'OVER':'UNDER')+' '+(r.line==null?'—':r.line)+' '+esc(STAT[r.stat]||r.stat).toUpperCase()+'</b><div class="g">'+esc(r.book||'')+'</div></td>'+
        '<td class="n hm">'+odds(r.odds)+'</td><td class="n hm">'+(r.proj==null?'—':r.proj)+'</td><td class="n hm">'+(r.l10avg==null?'—':r.l10avg)+'</td><td class="hm">'+esc(r.grade||'—')+'</td>'+
        '<td><span class="eb"><i class="'+(e<0?'ng':'')+'" style="width:'+w.toFixed(0)+'px"></i><b class="n" style="color:'+(e<0?'var(--neg)':'var(--acc)')+'">'+pts(e)+'</b></span></td><td>'+callPill(r)+'</td></tr>';}).join('');
    return '<div class="ph"><h1><small>Every prop the model graded today · '+d.board.rows.length+' rows</small>Board</h1><div class="chips">'+seg('stat',[['ALL','All'],['PTS','PTS'],['REB','REB'],['AST','AST'],['3PT','3PT']],state.boardStat)+'</div></div>'+
      '<div class="bar"><input class="search" id="q" type="search" placeholder="Search player or game" value="'+esc(state.q)+'"><div class="seg"><button id="formBtn" aria-pressed="'+!!state.boardForm+'">Form signal</button><button id="tmoBtn" aria-pressed="'+!!state.boardTmo+'">Teammate out · '+tmoBoardRows(d).length+'</button></div><div class="seg"><button id="onlyBtn" aria-pressed="'+state.boardOnly+'">Plays &amp; watch only</button></div></div>'+
      (state.boardTmo?tmoBoardView(d):'<div class="tablewrap"><table class="bt2"><thead>'+head+'</thead><tbody>'+(body||'<tr><td colspan="9" style="text-align:left">No props match.</td></tr>')+'</tbody></table></div>');
  }

  // ---- render + wiring -----------------------------------------------------
  function render(){
    var d=state.data;if(!d)return;
    renderNav();renderStatus();
    var V={tonight:viewTonight,results:viewResults,players:viewPlayers,performance:viewPerformance,board:viewBoard}[state.view]||viewTonight;
    var app=document.getElementById('app');
    app.innerHTML=V(d)+'<p class="foot">'+esc(d.version||'')+' · Not betting advice. Plays are provisional and tracked for evaluation.</p>';
    state.entered=true;wire();setTimeout(function(){pollLive(false);},50);
  }
  function go(v){state.view=v;ls('ps_view',v);render();window.scrollTo(0,0);}
  function wire(){
    document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-go'));};});
    document.querySelectorAll('[data-fcap]').forEach(function(b){b.onclick=function(){state.list=baseL(state.list)+(b.getAttribute('data-fcap')==='team'?'T':'');ls('ps_list',state.list);state.open=null;render();};});
    document.querySelectorAll('[data-list]').forEach(function(b){b.onclick=function(){var v0=b.getAttribute('data-list');state.list=isF(v0)&&capOn()?v0+'T':v0;ls('ps_list',state.list);state.open=null;render();};});
    if(0)document.querySelectorAll('[data-list]').forEach(function(b){b.onclick=function(){state.list=b.getAttribute('data-list');ls('ps_list',state.list);state.open=null;render();};});
    document.querySelectorAll('[data-r].rbtn').forEach(function(b){b.onclick=function(){var k=b.getAttribute('data-r'),c=b.closest('.pc'),o=c.getAttribute('data-r')!=='true';c.setAttribute('data-r',o);state.ropen[k]=o;b.firstChild.nodeValue=o?'Hide research ':'Show research ';};});
    document.querySelectorAll('[data-rview]').forEach(function(b){b.onclick=function(){state.full=b.getAttribute('data-rview')==='full';state.ropen={};ls('ps_full',state.full?'1':'');render();};});
    document.querySelectorAll('[data-gn]').forEach(function(b){b.onclick=function(e){e.stopPropagation();state.gn=+b.getAttribute('data-gn');ls('ps_gn',String(state.gn));render();};});
    document.querySelectorAll('[data-rlist]').forEach(function(b){b.onclick=function(){var v=b.getAttribute('data-rlist');if(v==='EVERY'){state.every=true;}else{state.every=false;state.list=isF(v)&&capOn()?v+'T':v;ls('ps_list',state.list);}ls('ps_every',state.every?'1':'');render();};});
    document.querySelectorAll('[data-fmode]').forEach(function(b){b.onclick=function(){state.fmode=b.getAttribute('data-fmode');ls('ps_fmode2',state.fmode);render();};});
    document.querySelectorAll('[data-psort]').forEach(function(b){b.onclick=function(){state.psort=b.getAttribute('data-psort');ls('ps_psort',state.psort);render();};});
    document.querySelectorAll('[data-rsort]').forEach(function(b){b.onclick=function(){state.rsort=b.getAttribute('data-rsort');ls('ps_rsort',state.rsort);render();};});
    document.querySelectorAll('[data-pera]').forEach(function(b){b.onclick=function(){state.pera=b.getAttribute('data-pera');ls('ps_pera',state.pera);render();};});
    document.querySelectorAll('[data-pid]').forEach(function(el){var t=function(){var id=el.getAttribute('data-pid');state.popen=state.popen===id?null:id;var w=el.parentNode,o=state.popen===id;document.querySelectorAll('.pwrap[data-open="true"]').forEach(function(x){if(x!==w){x.setAttribute('data-open','false');x.firstChild.setAttribute('aria-expanded','false');}});w.setAttribute('data-open',o);el.setAttribute('aria-expanded',o);};el.onclick=t;el.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();t();}};});
    document.querySelectorAll('[data-era]').forEach(function(b){b.onclick=function(){state.era=b.getAttribute('data-era');ls('ps_era',state.era);render();};});
    document.querySelectorAll('[data-date]').forEach(function(b){b.onclick=function(){state.date=b.getAttribute('data-date');render();};});
    var pd=document.getElementById('pickdate');if(pd)pd.onchange=function(){if(pd.value){state.date=pd.value;state.month=pd.value.slice(0,7);render();}};
    document.querySelectorAll('[data-month]').forEach(function(b){b.onclick=function(e){e.preventDefault();state.month=b.getAttribute('data-month');render();};});
    var cb=document.getElementById('calbox');if(cb)cb.ontoggle=function(){if(state.calOpen!==cb.open){state.calOpen=cb.open;ls('ps_cal',cb.open?'1':'');render();}};
    var rail=document.getElementById('rail');if(rail){var on=rail.querySelector('[aria-pressed="true"]');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center'});}
    document.querySelectorAll('[data-more]').forEach(function(b){b.onclick=function(){
      var k=b.getAttribute('data-more'),el=b.closest('.pc'),open=el.getAttribute('data-open')!=='true';
      document.querySelectorAll('.pc[data-open="true"]').forEach(function(o){if(o!==el)o.setAttribute('data-open','false');});
      state.open=open?k:null;el.setAttribute('data-open',open);
      if(open){var pool=state.data.tonight.filter(function(x){return onList(x);}).concat(state.data.tonight);var p=pool.filter(function(x){return pkey(x)===k;})[0];if(p)el.querySelector('.detail').innerHTML=detail(p);}
    };});
    var pq=document.getElementById('pq');if(pq)pq.oninput=function(){state.pq=pq.value.toLowerCase();var pos=pq.selectionStart;render();var n=document.getElementById('pq');if(n){n.focus();n.setSelectionRange(pos,pos);}};
    document.querySelectorAll('[data-stat]').forEach(function(b){b.onclick=function(){state.boardStat=b.getAttribute('data-stat');render();};});
    var ob=document.getElementById('onlyBtn');if(ob)ob.onclick=function(){state.boardOnly=!state.boardOnly;render();};
    var fb=document.getElementById('formBtn');if(fb)fb.onclick=function(){state.boardForm=!state.boardForm;render();};
    var tb=document.getElementById('tmoBtn');if(tb)tb.onclick=function(){state.boardTmo=!state.boardTmo;render();};
    document.querySelectorAll('[data-tmb]').forEach(function(el){el.onclick=function(){var k=el.getAttribute('data-tmb');state.tmoOpen=state.tmoOpen===k?null:k;render();};});
    document.querySelectorAll('[data-tmo]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var a=b.getAttribute('data-tmo').split('|');state.tmoSel=state.tmoSel||{};state.tmoSel[a[0]]=a[1];render();};});
    document.querySelectorAll('[data-tmos]').forEach(function(b){b.onclick=function(e){e.stopPropagation();state.tmoSeason=b.getAttribute('data-tmos');render();};});
    var q=document.getElementById('q');if(q)q.oninput=function(){state.q=q.value.toLowerCase();var pos=q.selectionStart;render();var n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(pos,pos);}};
    document.querySelectorAll('th[data-k]').forEach(function(th){th.onclick=function(){var k=th.getAttribute('data-k');state.sort=state.sort.k===k?{k:k,d:-state.sort.d}:{k:k,d:(k==='player'||k==='stat'?1:-1)};render();};});
  }
  document.getElementById('refresh').onclick=function(){if(!state.updating)load(true);};
  document.querySelector('.brand').onclick=function(){go('tonight');};

  // ---- live stat lines -----------------------------------------------------
  var liveAt=0,liveBusy=false;
  function liveTargets(){
    if(!state.data)return [];var now=Date.now();
    return state.data.tonight.concat(state.data.formCompare||[]).filter(function(p){if(!p.espnGameId||!p.espnId||!p.tipIso||p.outcome)return false;return Date.parse(p.tipIso)-now<10*60000&&now-Date.parse(p.tipIso)<5*3600000;});
  }
  function paintLive(){
    if(state.view!=='tonight'||!state.data)return;
    state.data.tonight.concat(state.data.formCompare||[]).forEach(function(p){var el=document.querySelector('.livebox[data-live="'+(window.CSS&&CSS.escape?CSS.escape(pkey(p)):pkey(p))+'"]');if(el){el.innerHTML=liveHtml(p);var pc=el.closest('.pc');if(pc)pc.classList.toggle('is-live',!!el.querySelector('.lv-bug'));}});
  }
  function pollLive(force){
    var t=liveTargets();if(!t.length||liveBusy)return;
    var allFinal=t.every(function(p){var g=state.live.games[p.espnGameId];return g&&g.state==='post';});
    if(!force&&Date.now()-liveAt<(allFinal?300000:30000))return;
    var g={},pl={};t.forEach(function(p){g[p.espnGameId]=1;pl[p.espnId]=1;});
    liveBusy=true;liveAt=Date.now();
    API.live(Object.keys(g).join(','),Object.keys(pl).join(','),function(d){liveBusy=false;if(d&&d.ok){state.live=d;paintLive();}});
  }
  setInterval(function(){if(document.visibilityState==='visible')pollLive(false);},5000);
  setInterval(function(){if(document.visibilityState==='visible'&&state.loadedAt&&Date.now()-state.loadedAt>10*60000)load();},60000);

  load();
})();
</script>
</body>
