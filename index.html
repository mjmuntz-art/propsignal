<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>var API_URL = 'https://script.google.com/macros/s/AKfycbyhKmpJu5AC_R8jhscBojGDAPzQAAt7Z4lPLdMpQea43HzxIS5dfuX65Rct009iIymk/exec';</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PropSignal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0F14">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NBAPropSignal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* NBAPropSignal board — PropSignal family (shared palette with NFLPropSignal). */
:root{
  --bg:#0A0F14;--bg2:#0D141B;--panel:#10171F;--panel2:#131C25;--panel3:#18222D;--line:#1E2A35;--line2:#2C3D4C;
  --ink:#E8EEF2;--ink2:#9AA8B4;--ink3:#7A8996;--dim:#5F6E7B;
  --mint:#3DDC97;--mint-bg:#0F2A1F;--mint-line:#2B6B51;
  --neg:#F08A6E;--neg-bg:#2A1611;--neg-line:#6B3A2E;
  --amber:#D9A440;--amber-bg:#1E190A;--amber-line:#5C4A1E;--gold:#E8B64C;--blue:#8DB8E8;
  --disp:'Barlow Condensed',system-ui,sans-serif;--text:'IBM Plex Sans',system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:6px}
.n{font-family:var(--disp);font-variant-numeric:tabular-nums}
.pos{color:var(--mint)}.neg{color:var(--neg)}.mut{color:var(--ink2)}.dim{color:var(--dim)}.amb{color:var(--amber)}
.wrap{max-width:1180px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 110px max(16px,env(safe-area-inset-left))}
.eyebrow{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink3);font-weight:600}
h1,h2,h3{margin:0;text-wrap:balance}

/* header + nav */
.top{position:sticky;top:0;z-index:40;background:rgba(10,15,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:8px 28px;min-height:58px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.brand{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:.2px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.brand i{font-style:normal;color:var(--mint)}
.nav{display:flex;gap:22px}
.nav button{background:none;border:0;color:var(--ink2);font-weight:500;font-size:14px;padding:18px 0 16px;border-bottom:2px solid transparent;cursor:pointer}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--mint)}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.stat{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--mint);box-shadow:0 0 0 3px var(--mint-bg)}.dot.warn{background:var(--amber)}.dot.bad{background:var(--neg)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;color:var(--ink2)}
.iconbtn:hover{color:var(--ink)}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabbar{display:none}
@media (max-width:760px){
  .nav,.stat .lbl{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(13,20,27,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--ink3);padding:4px 0;cursor:pointer}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--mint)}
}

/* controls */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;padding:3px;background:var(--panel)}
.seg button{border:0;background:none;color:var(--ink2);font-size:13px;font-weight:600;padding:7px 13px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.seg.mint button[aria-pressed="true"]{background:var(--mint-bg);color:var(--mint);box-shadow:inset 0 0 0 1px var(--mint-line)}
.search{flex:1;min-width:170px;max-width:300px;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font:inherit}

/* page head (Slate-style editorial header) */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin:6px 0 16px}
.ph h1{font-family:var(--disp);font-weight:800;font-size:44px;line-height:.95;letter-spacing:.2px}
.ph h1 small{display:block;font-size:14px;font-family:var(--text);font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);font-size:12.5px;color:var(--ink2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.chip.mint{border-color:var(--mint-line);background:var(--mint-bg);color:var(--mint)}
.chip.mint b{color:var(--mint)}
.chip.amb{border-color:var(--amber-line);background:var(--amber-bg);color:var(--amber)}
.chip.neg{border-color:var(--neg-line);background:var(--neg-bg);color:var(--neg)}

/* play cards */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:900px){.cards{grid-template-columns:1fr}}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pc.pending{border-style:dashed;border-color:var(--line2)}
.pc.void{opacity:.55}
.pc-hero{position:relative;height:118px;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 55%,#0A0F14) 0%,color-mix(in srgb,var(--tc) 22%,#0A0F14) 55%,#0E151C 100%);overflow:hidden}
.pc-hero .court{position:absolute;inset:0;width:100%;height:100%;opacity:.13}
.pc-hero .wm{position:absolute;right:-26px;top:-18px;width:150px;height:150px;opacity:.18}
.pc-hero .hs{position:absolute;left:14px;bottom:-4px;height:118px;width:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.pc-hero .lg{position:absolute;left:14px;top:12px;width:38px;height:38px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.pc-hero .lg.solo{width:70px;height:70px;top:24px}
.pc-hero .who{position:absolute;left:150px;right:14px;bottom:12px}
.pc-hero .nm{font-family:var(--disp);font-weight:800;font-size:27px;line-height:1;text-shadow:0 1px 8px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-hero .mt{font-size:12.5px;color:rgba(232,238,242,.78);margin-top:3px}
.pc-hero .tl{position:absolute;top:10px;right:12px;display:flex;gap:6px}
.badge{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.6px;padding:3px 9px;border-radius:999px;background:rgba(10,15,20,.72);border:1px solid rgba(255,255,255,.14);color:var(--ink)}
.badge.lock{color:var(--mint);border-color:var(--mint-line)}
.badge.open{color:var(--amber);border-color:var(--amber-line)}
.badge.live{background:var(--neg);border-color:var(--neg);color:#fff;display:inline-flex;align-items:center;gap:5px}
.badge.live i{width:6px;height:6px;border-radius:50%;background:#fff;display:inline-block}
@media (prefers-reduced-motion:no-preference){.badge.live i{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}}
.badge.out{background:var(--neg-bg);color:var(--neg);border-color:var(--neg-line)}
.pc-body{padding:14px 16px 6px}
.pick{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pick .dir{font-family:var(--disp);font-weight:800;font-size:30px;line-height:1;letter-spacing:.3px}
.pick .dir.over{color:var(--mint)}.pick .dir.under{color:var(--blue)}
.pick .ln{font-family:var(--disp);font-weight:800;font-size:30px;line-height:1}
.pick .st{font-family:var(--disp);font-weight:600;font-size:18px;color:var(--ink2);text-transform:uppercase}
.price{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--ink2)}
.price b{font-family:var(--disp);font-weight:800;font-size:22px;color:var(--ink);line-height:1}
.dec{font-family:var(--disp);font-weight:700;font-size:12.5px;letter-spacing:.8px;padding:2px 8px;border-radius:5px;vertical-align:4px}
.dec.PLAY{background:var(--mint);color:#062016}.dec.LEAN{color:var(--mint);box-shadow:inset 0 0 0 1.5px var(--mint-line)}
.dec.VOID{background:var(--line2);color:var(--ink2)}
/* "why it's a play" tiles */
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 4px}
@media (max-width:440px){.why{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 10px 10px;min-width:0}
.tile .k{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3);font-weight:600;white-space:nowrap}
.tile .v{font-family:var(--disp);font-weight:800;font-size:28px;line-height:1.05;margin-top:2px;white-space:nowrap}
.tile .s{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.3}
.tile.hero{background:var(--mint-bg);border-color:var(--mint-line)}
.tile.hero .v{color:var(--mint)}
.meter{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:7px}
.meter .f{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--mint)}
.meter .t{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.flag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2)}
.flag b{color:var(--ink);font-weight:600}
.flag.good{border-color:var(--mint-line);color:var(--mint);background:var(--mint-bg)}
.flag.good b{color:var(--mint)}
.flag.warn{border-color:var(--amber-line);color:var(--amber);background:var(--amber-bg)}
.flag.bad{border-color:var(--neg-line);color:var(--neg);background:var(--neg-bg)}
.pc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px 12px;border-top:1px solid var(--line);margin-top:8px;font-size:12.5px;color:var(--ink2)}
.pc-foot .lk.on{color:var(--mint);font-weight:600}.pc-foot .lk.off{color:var(--amber);font-weight:600}.pc-foot .lk.bad{color:var(--neg);font-weight:700}
.more{background:none;border:0;color:var(--ink2);font-weight:600;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:6px 0}
.more i{font-style:normal;transition:transform .2s}
.pc[data-open="true"] .more i{transform:rotate(180deg)}
.detail{display:none;padding:4px 16px 16px;border-top:1px solid var(--line)}
.pc[data-open="true"] .detail{display:block}
/* live */
.live{margin-top:12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.live .row1{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.live .now{font-family:var(--disp);font-weight:800;font-size:30px;line-height:1}
.live .now small{font-size:16px;color:var(--ink2);font-weight:600;margin-left:3px}
.live .row2{display:flex;align-items:baseline;gap:12px;margin-top:6px;flex-wrap:wrap}
.live .need{font-weight:600}
.live .need.good{color:var(--mint)}.live .need.bad{color:var(--neg)}
.lmeter{position:relative;height:8px;border-radius:4px;background:var(--line);margin-top:8px}
.lmeter .f{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--blue);transition:width .6s ease}
.lmeter .f.good{background:var(--mint)}.lmeter .f.bad{background:var(--neg)}
.lmeter .t{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
/* detail */
.dhead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin:12px 0 8px;font-size:13px;color:var(--ink2)}
.dhead b{color:var(--ink)}
.chart{display:block;width:100%;height:auto;max-height:200px;color:var(--ink)}
.avgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.avg{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.avg .v{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.avg .v b{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--ink);margin-right:2px}
.avg .v .hi b{color:var(--mint)}
table.gl{width:100%;border-collapse:collapse;font-size:13px}
.gl th{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3);font-weight:600;text-align:right;padding:6px 5px}
.gl td{text-align:right;padding:6px 5px;border-top:1px solid var(--line)}
.gl th:nth-child(-n+2),.gl td:nth-child(-n+2){text-align:left}
.gl td.st{font-weight:700}.gl td.st.h{color:var(--mint)}.gl td.st.m{color:var(--neg)}
.gl tr.prev td{color:var(--dim)}

/* sections */
.sec{margin-top:26px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sech h2{font-family:var(--disp);font-weight:700;font-size:24px}
.sech span{font-size:12.5px;color:var(--ink3)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.empty{background:var(--panel);border:1px dashed var(--line2);border-radius:var(--r);padding:20px;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* compact rows (results, cooled, replay) */
.rr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.rr:first-child{border-top:0}
.rr .av{width:44px;height:44px;border-radius:10px;overflow:hidden;background:color-mix(in srgb,var(--tc,#334155) 30%,#0A0F14);position:relative;display:flex;align-items:flex-end;justify-content:center}
.rr .av img.h{width:56px;height:auto}
.rr .av img.l{width:26px;height:26px;align-self:center}
.rr .p{font-weight:600}
.rr .p .pk{color:var(--ink)}
.rr .d{font-size:12px;color:var(--ink3);margin-top:1px}
.rr .why2{font-size:12.5px;color:var(--amber);font-weight:600;margin-top:2px}
.rr .rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.oc{font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.6px;padding:2px 8px;border-radius:5px}
.oc.HIT{background:var(--mint);color:#062016}.oc.MISS{background:var(--neg);color:#2A0F09}.oc.PUSH{background:var(--amber);color:#1E190A}
.oc.DNP,.oc.VOID{background:var(--line2);color:var(--ink2)}.oc.OPEN{box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink3)}
.rr .u{font-family:var(--disp);font-weight:700;font-size:17px}
.vs{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px;color:var(--ink2)}
.vs .bar{position:relative;flex:0 0 120px;height:6px;border-radius:3px;background:var(--line);margin:0}
.vs .bar .f{position:absolute;inset:0 auto 0 0;border-radius:3px}
.vs .bar .t{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2)}
.rr.blk .p .pk{text-decoration:line-through;text-decoration-color:var(--dim)}
details.fold>summary{list-style:none;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
.foldh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px}
.foldh h3{font-family:var(--disp);font-weight:700;font-size:19px}
.foldh span{font-size:12.5px;color:var(--ink3)}
details.fold[open] .foldh{border-bottom:1px solid var(--line)}

/* results: date rail + scoreboard */
.rail{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.day{flex:0 0 auto;min-width:74px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;cursor:pointer;color:var(--ink2)}
.day .dw{font-size:11px;letter-spacing:.8px;text-transform:uppercase;font-weight:600}
.day .dd{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--ink);line-height:1.1}
.day .dr{font-family:var(--disp);font-weight:700;font-size:14px;margin-top:2px}
.day[aria-pressed="true"]{border-color:var(--mint);background:var(--mint-bg)}
.day.up .dr{color:var(--mint)}.day.down .dr{color:var(--neg)}.day.flat .dr{color:var(--ink3)}
.pickdate{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.pickdate input{background:var(--panel);border:1px solid var(--line2);border-radius:8px;color:var(--ink);padding:6px 8px;font:inherit;color-scheme:dark}
.sb{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
@media (max-width:640px){.sb{grid-template-columns:1fr 1fr}.sb .c1{grid-column:1/-1}}
.sb>div{background:var(--panel);padding:12px 14px}
.sb .k{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3);font-weight:600}
.sb .v{font-family:var(--disp);font-weight:800;font-size:34px;line-height:1.05}
.sb .c1 .v{font-size:40px}
.sb .s{font-size:12px;color:var(--ink2)}

/* performance */
.bug{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:760px){.bug{grid-template-columns:1fr}}
.bug>div{background:var(--panel);padding:16px}
.bug .wl{font-family:var(--disp);font-weight:800;font-size:64px;line-height:.95}
.bug .uu{font-family:var(--disp);font-weight:700;font-size:28px;margin-left:12px}
.bug .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bug .grid .k{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3);font-weight:600}
.bug .grid .v{font-family:var(--disp);font-weight:800;font-size:28px;line-height:1.05}
.spark{display:block;width:100%;height:60px;margin-top:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:900px){.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h3{font-family:var(--disp);font-weight:700;font-size:20px}
.card .note{font-size:12.5px;color:var(--ink3);margin:3px 0 10px}
.top1 .big{font-family:var(--disp);font-weight:800;font-size:42px;line-height:1}
.top1 .big small{font-size:20px;margin-left:8px}
.split{display:grid;grid-template-columns:88px minmax(0,1fr) 62px 66px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.split:first-of-type{border-top:0}
.split .lab{font-family:var(--disp);font-weight:700;font-size:16px}
.track{position:relative;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.track .f{position:absolute;inset:0 auto 0 0;background:var(--mint);border-radius:4px}
.track .be{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.6}
.split .r{text-align:right;color:var(--ink2)}.split .r b{color:var(--ink)}
.eranote{font-size:12.5px;color:var(--ink3);margin:8px 2px 0}

.split.thin{opacity:.5}
.split.thin .lab::after{content:'small sample';display:block;font-family:var(--text);font-weight:500;font-size:10.5px;color:var(--ink3);letter-spacing:.2px}
.track .ex{position:absolute;top:-1px;bottom:-1px;width:3px;margin-left:-1px;background:var(--blue);border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink3);margin:-4px 0 8px}
.legend i{display:inline-block;width:3px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mv{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.mv .from{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--dim)}
.mv .tag{font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:11.5px}
.mv .tag.our{color:var(--mint);border-color:var(--mint-line);background:var(--mint-bg)}
.mv .tag.vs{color:var(--amber);border-color:var(--amber-line);background:var(--amber-bg)}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 14px}
.cal .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.cal .ch h3{font-family:var(--disp);font-weight:700;font-size:19px}
.cal .ch .tot{font-size:12.5px;color:var(--ink2)}
.cal .nv{background:var(--panel2);border:1px solid var(--line);border-radius:8px;width:32px;height:30px;cursor:pointer;color:var(--ink2)}
.cal .nv:disabled{opacity:.35;cursor:default}
.cal .gr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);text-align:center;font-weight:600;padding-bottom:2px}
.cal .cd{min-height:50px;border-radius:8px;background:var(--bg2);border:1px solid transparent;padding:4px 5px;text-align:left;color:var(--dim);font-size:11px;display:flex;flex-direction:column;justify-content:space-between}
.cal button.cd{cursor:pointer;color:var(--ink2)}
.cal .cd b{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--ink);line-height:1}
.cal .cd .u{font-size:10.5px;font-weight:600}
.cal .cd.up{background:color-mix(in srgb,var(--mint) calc(var(--a) * 1%),var(--bg2))}
.cal .cd.down{background:color-mix(in srgb,var(--neg) calc(var(--a) * 1%),var(--bg2))}
.cal .cd[aria-pressed="true"]{border-color:var(--ink)}
.cal .cd.blank{background:transparent}
@media (max-width:520px){.cal .cd .u{display:none}.cal .cd{min-height:44px}.cal .cd b{font-size:14px}}
.big2{font-family:var(--disp);font-weight:800;font-size:38px;line-height:1}
.big2 small{font-size:18px;margin-left:8px;font-weight:700}
.luck{position:relative;height:10px;background:var(--line);border-radius:5px;margin:12px 0 6px}
.luck .f{position:absolute;inset:0 auto 0 0;background:var(--ink2);border-radius:5px;opacity:.35}
.luck .a{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;border-radius:2px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
.kv:first-of-type{border-top:0}.kv b{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--ink)}
.mini{font-size:12.5px;color:var(--ink2);padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.mini .oc{font-size:11px;padding:1px 7px}
.subh{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:12px 0 2px}

/* players */
.plist{display:flex;flex-direction:column;gap:8px}
.pr{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:12px;padding:8px 14px 8px 8px}
.pr .av{width:54px;height:54px;border-radius:10px;overflow:hidden;background:color-mix(in srgb,var(--tc) 30%,#0A0F14);display:flex;align-items:flex-end;justify-content:center}
.pr .av img.h{width:66px}.pr .av img.l{width:30px;height:30px;align-self:center}
.pr .nm{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.1}
.pr .sub{font-size:12px;color:var(--ink3)}
.pr .wl2{font-family:var(--disp);font-weight:800;font-size:24px;text-align:right;line-height:1}
.pr .u2{font-size:13px;font-weight:600;text-align:right}
.dots{display:flex;gap:4px;margin-top:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--dim);display:inline-block}
.dots i.HIT{background:var(--mint)}.dots i.MISS{background:var(--neg)}.dots i.PUSH{background:var(--amber)}

/* board table */
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:70vh}
table.bt{width:100%;border-collapse:collapse;font-size:13px}
.bt th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:600;color:var(--ink2);padding:9px 10px;font-size:12px;white-space:nowrap;cursor:pointer;user-select:none}
.bt td{padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap}
.bt td img{width:18px;height:18px;vertical-align:-4px;margin-right:6px}
.bt .PLAY{color:var(--mint);font-weight:700}.bt .LEAN{color:var(--mint)}.bt .WATCH{color:var(--amber)}.bt .PASS{color:var(--dim)}

.foot{margin-top:30px;color:var(--dim);font-size:12px}
.err{background:var(--panel);border:1px solid var(--neg-line);border-left:4px solid var(--neg);padding:16px;border-radius:10px;margin-top:20px}
.loading{padding:80px 0;text-align:center;color:var(--ink3);font-family:var(--disp);font-size:22px}
.note2{font-size:12.5px;color:var(--ink3);line-height:1.5}
@media (prefers-reduced-motion:no-preference){.cards.enter .pc{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}.cards.enter .pc:nth-child(2){animation-delay:.05s}.cards.enter .pc:nth-child(3){animation-delay:.1s}.cards.enter .pc:nth-child(4){animation-delay:.15s}@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}}

<body>
<header class="top"><div class="topin">
  <button class="brand" data-go="tonight" aria-label="NBAPropSignal home">NBAPropSignal<i>.</i></button>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <div class="tools"><span class="stat" id="stat"></span><button class="iconbtn" id="refresh" aria-label="Refresh"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button></div>
</div></header>
<main class="wrap" id="app"><div class="loading">Loading tonight's card…</div></main>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<script>
var API = (function(){
  function url(q){return API_URL+(API_URL.indexOf('?')===-1?'?':'&')+q+'&t='+Date.now();}
  function ok(){return API_URL&&API_URL.indexOf('/exec')!==-1;}
  function get(q,cb,bad){
    fetch(url(q),{cache:'no-store',redirect:'follow'}).then(function(r){return r.text();}).then(function(t){
      t=(t||'').trim();
      if(t.charAt(0)==='<'){bad("Couldn't load: the script sent a web page instead of data.","In Apps Script: Deploy → Manage deployments → pencil. Set Execute as: Me and Who has access: Anyone, choose New version, and Deploy.");return;}
      var d;try{d=JSON.parse(t);}catch(e){bad("Couldn't load: the data was unreadable.","Deploy a new version of the script and try again.");return;}
      cb(d);
    }).catch(function(e){bad("Couldn't reach your script.","Check your connection, or the /exec link on line 5 of index.html. ("+(e&&e.message||e)+")");});
  }
  return {
    card:function(fresh,cb,bad){if(!ok()){bad('Link is missing.','Open index.html on GitHub, tap the pencil, and paste your Apps Script web app link (it ends in /exec) on line 5 between the quotes.');return;}get('api=card'+(fresh?'&fresh=1':''),cb,bad);},
    live:function(g,p,cb){if(!ok()){cb(null);return;}get('api=live&g='+encodeURIComponent(g)+'&p='+encodeURIComponent(p),cb,function(){cb(null);});},
    day:function(date,cb){if(!ok()){cb(null);return;}get('api=day&date='+encodeURIComponent(date),cb,function(){cb(null);});}
  };
})();
(function(){
  var VIEWS=[['tonight','Tonight','M3 12l9-8 9 8M5 10v10h14V10'],['results','Results','M8 3v4M16 3v4M3 10h18M5 6h14v15H5z'],['players','Players','M16 19v-1a4 4 0 0 0-8 0v1M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6'],['performance','Record','M4 19V9M10 19V5M16 19v-7M22 19H2'],['board','Board','M3 5h18M3 10h18M3 15h18M3 20h18']];
  var STAT={PTS:'pts',REB:'reb',AST:'ast','3PT':'3pm'};
  var LISTS=[['ALL','All'],['OVER','Top overs'],['UNDER','Top unders']];
  var ERAS=[['current','Current rules'],['all','All-time'],['replay','Replay']];
  var state={data:null,view:'tonight',list:'ALL',era:'current',date:null,days:{},open:null,live:{games:{},players:{}},boardStat:'ALL',boardOnly:false,q:'',pq:'',sort:{k:'edge',d:-1},updating:false,entered:false,month:null,calOpen:false};
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
  (function(){var v=ls('ps_view');if(v&&/^(tonight|results|players|performance|board)$/.test(v))state.view=v;var l=ls('ps_list');if(l&&/^(ALL|OVER|UNDER)$/.test(l))state.list=l;var e=ls('ps_era');if(e&&/^(current|all|replay)$/.test(e))state.era=e;state.calOpen=ls('ps_cal')==='1';})();

  // ---- formatting ----------------------------------------------------------
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function signed(v,dp){var n=Number(v);return (n>0?'+':(n<0?'−':''))+Math.abs(n).toFixed(dp);}
  function odds(o){if(o==null||o==='')return '—';o=Number(o);return (o>0?'+':(o<0?'−':''))+Math.abs(o);}
  function pct(x,d){if(x==null)return '—';return (x*100).toFixed(d==null?1:d)+'%';}
  function pts(x){return x==null?'—':signed(x*100,1);}
  function units(u){return u==null?'—':signed(u,2)+'u';}
  function cls(u){return u>0?'pos':(u<0?'neg':'');}
  function wl(r){if(!r)return '0–0';return r.w+'–'+r.l+(r.p?'–'+r.p:'');}
  function dayLabel(k,opt){if(!k)return '';var p=k.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);return d.toLocaleDateString(undefined,opt||{weekday:'short',month:'short',day:'numeric'});}
  function words(s){s=String(s||'').replace(/_/g,' ').toLowerCase();return s?s.charAt(0).toUpperCase()+s.slice(1):'';}
  function pickTxt(dir,line,stat){return (dir==='Over'?'Over ':'Under ')+(line==null?'—':line)+' '+(STAT[stat]||stat);}
  function hitOf(v,p){if(v==null||p.line==null)return '';if(v===p.line)return 'p';return (p.direction==='Over'?v>p.line:v<p.line)?'h':'m';}
  function onList(p){var L=state.list;if(p.lists&&p.lists.length)return p.lists.indexOf(L)!==-1;return L==='ALL'||String(p.direction||'').toUpperCase()===L;}
  function listName(){for(var i=0;i<LISTS.length;i++)if(LISTS[i][0]===state.list)return LISTS[i][1];return 'All';}
  function pkey(p){return p.key||p.id||(p.player+p.stat+p.direction);}
  function seg(name,opts,cur,mint){return '<div class="seg'+(mint?' mint':'')+'" role="group">'+opts.map(function(o){return '<button data-'+name+'="'+o[0]+'" aria-pressed="'+(cur===o[0])+'">'+o[1]+'</button>';}).join('')+'</div>';}
  var COURT='<svg class="court" viewBox="0 0 400 120" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#fff" stroke-width="2"><circle cx="330" cy="60" r="34"/><circle cx="330" cy="60" r="96"/><line x1="330" y1="-10" x2="330" y2="130"/><rect x="-20" y="22" width="110" height="76"/><circle cx="90" cy="60" r="26"/></svg>';
  function face(p,cls1,cls2){
    return p.headshot?'<img class="'+cls1+'" alt="" src="'+esc(p.headshot)+'" onerror="this.remove()">':'<img class="'+cls2+'" alt="" src="'+esc(p.teamLogo)+'" onerror="this.style.visibility=\'hidden\'">';
  }

  // ---- data loading --------------------------------------------------------
  function setUpdating(on){state.updating=on;var b=document.getElementById('refresh');if(b)b.classList.toggle('spin',!!on);}
  function load(fresh){
    if(window.__CARD_SAMPLE__){state.data=window.__CARD_SAMPLE__;render();return;}
    if(!state.data){var sc=ls('ps_card_v2');try{sc=sc&&JSON.parse(sc);}catch(e){sc=null;}if(sc&&sc.d){state.data=sc.d;render();}}
    setUpdating(true);
    API.card(fresh===true,function(d){
      setUpdating(false);
      if(!d||d.ok===false){fail('The card could not load.',esc(d&&d.message||'No data returned.'));return;}
      // P34.1: a card built by older code lacks the fields this board needs; rebuild it once.
      if(!d.days&&!fresh&&!state.rebuilt){state.rebuilt=true;state.notice='Updating to the new board… this can take a minute.';if(!state.data){state.data=d;render();}else renderStatus();load(true);return;}
      state.notice='';state.data=d;state.loadedAt=Date.now();try{ls('ps_card_v2',JSON.stringify({at:Date.now(),d:d}));}catch(e){}
      render();
    },function(title,detail){setUpdating(false);fail(title,detail);});
  }
  function fail(title,detail){
    if(state.data){state.notice=title;renderStatus();return;}
    document.getElementById('app').innerHTML='<div class="err"><b>'+esc(title)+'</b><br>'+detail+'</div>';
  }
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&state.data&&state.loadedAt&&Date.now()-state.loadedAt>10*60000)load();pollLive(true);});

  // ---- header / nav --------------------------------------------------------
  function renderNav(){
    var nav='',tab='';
    VIEWS.forEach(function(v){
      var cur=state.view===v[0]?' aria-current="page"':'';
      nav+='<button data-go="'+v[0]+'"'+cur+'>'+v[1]+'</button>';
      tab+='<button data-go="'+v[0]+'"'+cur+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="'+v[2]+'"/></svg>'+v[1]+'</button>';
    });
    document.getElementById('nav').innerHTML=nav;document.getElementById('tabbar').innerHTML=tab;
  }
  function renderStatus(){
    var d=state.data||{},sys=d.system||{},auto=sys.automation||{},pub=(d.publication||{}).status;
    var ok=auto.enabled&&auto.healthy!==false;
    var txt=state.notice?esc(state.notice):(state.updating?'Updating…':'Updated '+esc((d.refreshedAt||'').replace(/^.*·\s*/,'')));
    document.getElementById('stat').innerHTML='<span class="dot '+(state.notice?'bad':(ok?(pub==='APPROVED_CURRENT'?'ok':'warn'):'warn'))+'" title="'+esc(pub||'')+'"></span><span class="lbl">'+txt+'</span>';
  }

  // ---- tonight -------------------------------------------------------------
  function rankMap(list){
    var r={},sorted=list.slice().sort(function(a,b){var da=a.decision==='PLAY'?0:1,db=b.decision==='PLAY'?0:1;if(da!==db)return da-db;return (b.edge||0)-(a.edge||0);});
    sorted.forEach(function(p,i){r[pkey(p)]=i+1;});return r;
  }
  function form(p){
    var P=((state.data||{}).players||{})[p.playerId];if(!P||!P.last)return null;
    var l10=P.last.slice(0,10).filter(function(x){return x[p.stat]!=null;});
    var h=l10.filter(function(x){return hitOf(x[p.stat],p)==='h';}).length;
    return {h:h,n:l10.length,season:P.season&&P.season[p.stat]};
  }
  // P34: first line seen today vs now (or vs the locked number).
  function impl(o){o=Number(o);if(!o)return null;return o<0?-o/(-o+100):100/(o+100);}
  function moveHtml(p){
    if(p.firstLine==null||p.line==null)return '';
    var dl=p.line-p.firstLine,io=impl(p.odds),iF=impl(p.firstOdds),dp=(io!=null&&iF!=null)?io-iF:0;
    if(Math.abs(dl)<0.01&&Math.abs(dp)<0.004)return '';
    var over=p.direction==='Over';
    // The market moves our way when the line moves in the bet's direction, or
    // the same line gets more expensive on our side.
    var our=Math.abs(dl)>=0.01?(over?dl>0:dl<0):dp>0;
    return '<div class="mv"><span>'+(p.locked?'First seen':'Opened')+(p.firstAt?' '+esc(p.firstAt):'')+'</span><span class="from n">'+p.firstLine+' '+odds(p.firstOdds)+'</span><span>→</span><b class="n">'+p.line+' '+odds(p.odds)+'</b>'+
      '<span class="tag '+(our?'our':'vs')+'">'+(our?'Market moving our way':'Market moving against us')+'</span></div>';
  }
  function playCard(p,rank){
    var c=p.ctx||{},isVoid=p.outcome==='VOID',outNow=!isVoid&&/^(OUT|DOUBTFUL|INACTIVE|SUSPENDED)$/.test(p.status||'');
    var k=esc(pkey(p)),open=state.open===pkey(p);
    var g=state.live.games[p.espnGameId],isLive=g&&g.state==='in';
    var badge=isVoid?'<span class="badge out">VOID</span>':outNow?'<span class="badge out">'+esc(String(p.status))+' · WILL VOID</span>':
      isLive?'<span class="badge live"><i></i>LIVE</span>':p.locked?'<span class="badge lock">LOCKED '+esc(p.lockedAt||'')+'</span>':'<span class="badge open">LOCKS ~'+esc(p.locksAt||'')+'</span>';
    var rk=rank?'<span class="badge">#'+rank+' '+(state.list==='ALL'?'ALL':state.list==='OVER'?'OVER':'UNDER')+'</span>':'';
    var fm=form(p),proj=p.proj,gap=(proj!=null&&p.line!=null)?(p.direction==='Over'?proj-p.line:p.line-proj):null;
    var tiles=
      '<div class="tile hero"><div class="k">Edge</div><div class="v n">'+pts(p.edge)+'</div><div class="s">'+pct(p.modelP,0)+' hit chance, '+pct(p.breakEven,0)+' needed</div>'+
        '<div class="meter" aria-hidden="true"><div class="f" style="width:'+Math.min(100,(p.modelP||0)*100).toFixed(0)+'%"></div><div class="t" style="left:'+Math.min(100,(p.breakEven||0)*100).toFixed(0)+'%"></div></div></div>'+
      '<div class="tile"><div class="k">Projection</div><div class="v n">'+(proj==null?'—':proj)+'</div><div class="s">'+(gap==null?'xEP':'<span class="'+(gap>0?'pos':'neg')+'">'+Math.abs(gap).toFixed(1)+'</span> '+(p.direction==='Over'?(gap>0?'above':'below'):(gap>0?'below':'above'))+' the line')+'</div></div>'+
      '<div class="tile"><div class="k">'+(fm&&fm.n?'Last '+fm.n:'Last 5')+'</div><div class="v n">'+(fm&&fm.n?fm.h+'/'+fm.n:esc(p.l5||'—'))+'</div><div class="s">'+(fm&&fm.n?'cleared '+p.line:'per xEP')+(c.l10avg!=null?' · L10 avg '+c.l10avg:'')+'</div></div>'+
      '<div class="tile"><div class="k">Minutes</div><div class="v n">'+(c.projMin==null?'—':Math.round(c.projMin))+'</div><div class="s">projected'+(c.matchup?' · '+words(c.matchup)+(c.matchupPct!=null?' '+signed(c.matchupPct*100,0)+'%':'')+' matchup':'')+'</div></div>';
    var flags=[];
    function flag(t,cl){flags.push('<span class="flag'+(cl?' '+cl:'')+'">'+t+'</span>');}
    flag('Grade <b>'+esc(p.grade||'—')+'</b>',(p.grade||'').indexOf('A+')===0?'good':'');
    if(c.roleUp)flag('Role up: <b>'+esc(c.roleUp)+' out</b>','good');
    if(c.xepLine!=null&&p.line!=null&&c.xepLine!==p.line)flag('xEP line <b>'+c.xepLine+'</b>',(p.direction==='Over'?p.line<c.xepLine:p.line>c.xepLine)?'good':'warn');
    if(c.consensus!=null)flag('Market <b>'+c.consensus+'</b>');
    if(c.starter)flag(c.starter==='S'?'<b>Starter</b>':'Bench');
    if(c.minTrend&&!/STABLE/.test(c.minTrend))flag('Minutes <b>'+esc(words(c.minTrend))+'</b>',/UP|RIS/.test(c.minTrend)?'good':'warn');
    if(c.xepInjury)flag('xEP tag <b>'+esc(c.xepInjury)+'</b>','warn');

    var mw=morning.filter(function(x){return x.outcome==='HIT';}).length,ml=morning.filter(function(x){return x.outcome==='MISS';}).length,mu=0;morning.forEach(function(x){mu+=x.units||0;});
    h+='<div class="sb"><div class="c1"><div class="k">'+esc(dayLabel(state.date,{weekday:'long',month:'long',day:'numeric'}))+' · '+esc(listName())+'</div><div class="v n">'+w+'–'+l+' <span class="'+cls(u)+'">'+units(Math.round(u*100)/100)+'</span></div><div class="s">'+plays.length+' locked play'+(plays.length===1?'':'s')+(w+l?' · '+Math.round(w/(w+l)*100)+'% hit':'')+'</div></div>'+
      '<div><div class="k">Model cooled</div><div class="v n">'+(cooled.length?cw+'–'+cl2:'—')+'</div><div class="s">'+(cooled.length?units(Math.round(cu*100)/100)+' if played':'none that day')+'</div></div>'+
      '<div><div class="k">Morning card</div><div class="v n">'+(morning.length?mw+'–'+ml:'—')+'</div><div class="s">'+(morning.length?units(Math.round(mu*100)/100)+' · replay':'not replayed yet')+'</div></div>'+
      '</div>';
    h+='<section class="sec"><div class="sech"><h2>Locked plays</h2><span>What counted</span></div>'+(plays.length?'<div class="box">'+plays.map(resultRow).join('')+'</div>':'<div class="empty">No locked plays on this list that day.</div>')+'</section>';
    if(cooled.length)h+='<section class="sec"><details class="fold box" open><summary class="foldh"><h3>Model cooled · '+cooled.length+'</h3><span>On the card earlier, dropped before lock</span></summary>'+cooled.map(cooledRow).join('')+'</details></section>';
    if(morning.length||blocked.length)h+='<section class="sec"><details class="fold box"><summary class="foldh"><h3>Morning card (replay) · '+morning.length+'</h3><span>Today’s rules at that morning’s lines</span></summary>'+morning.map(resultRow).join('')+
      (blocked.length?'<div class="foldh" style="border-top:1px solid var(--line)"><h3 style="font-size:16px">Locked plays today’s rules would block</h3><span>'+blocked.length+'</span></div>'+blocked.map(resultRow).join(''):'')+'</details></section>';
    return h;
  }

  // ---- players -------------------------------------------------------------
  function viewPlayers(d){

      var r=state.list==='ALL'?p.record:(p.lists[state.list]||p.record);

      return '<div class="pr" style="--tc:'+esc(p.teamColor)+'"><div class="av">'+face(p,'h','l')+'</div>'+
        '<div><div class="nm">'+esc(p.player)+'</div><div class="sub">'+esc(p.team)+' · '+r.plays+' play'+(r.plays===1?'':'s')+(r.hitRate!=null?' · '+Math.round(r.hitRate*100)+'% hit':'')+' · '+esc((p.stats||[]).slice(0,3).map(function(s){return s.k;}).join(', '))+'</div><div class="dots">'+dots+'</div></div>'+
        '<div><div class="wl2 n">'+wl(r)+'</div><div class="u2 n '+cls(r.units)+'">'+units(r.units)+'</div></div></div>';
    }).join('')+'</div>';
  }

  // ---- performance ---------------------------------------------------------
  function spark(daily){
    if(!daily||daily.length<2)return '';
    var w=300,h=60,pad=4,vals=[0].concat(daily.map(function(x){return x.cumulative;}));
    var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(mx===mn){mx+=1;mn-=1;}
    var x=function(i){return pad+i*(w-2*pad)/(vals.length-1);},y=function(v){return h-pad-(v-mn)*(h-2*pad)/(mx-mn);};
    var path=vals.map(function(v,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);}).join(' '),last=vals[vals.length-1];
    return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Units by day"><line x1="0" x2="'+w+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="#7A8996" stroke-opacity=".5" stroke-dasharray="3 3"/><path d="'+path+'" fill="none" stroke="'+(last>=0?'#3DDC97':'#F08A6E')+'" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>';
  }
  var THIN=20;
  function splitRows(list,showExp){
    if(!list||!list.length)return '<p class="note2">No graded plays yet.</p>';
    return list.map(function(r){var dec=r.w+r.l,hr=dec?r.w/dec:0,ex=(showExp&&r.expN)?r.exp/r.expN:null;
      return '<div class="split'+(dec<THIN?' thin':'')+'"><span class="lab">'+esc(r.key)+'</span><div class="track"><div class="f" style="width:'+(hr*100).toFixed(1)+'%"></div><div class="be" style="left:52.4%"></div>'+(ex!=null?'<div class="ex" style="left:'+(ex*100).toFixed(1)+'%" title="Model expected '+Math.round(ex*100)+'%"></div>':'')+'</div><span class="r n"><b>'+wl(r)+'</b></span><span class="r n '+cls(r.units)+'">'+units(r.units)+'</span></div>';}).join('');
  }
  function legend(exp){return '<div class="legend"><span><i style="background:var(--ink);opacity:.6"></i>break-even at −110</span>'+(exp?'<span><i style="background:var(--blue)"></i>what the model expected</span>':'')+'<span>faded = under '+THIN+' decided plays</span></div>';}
  // P34: luck meter, streaks and drawdown, near misses.
  function luckBlock(S,X){
    var dec=(S.w||0)+(S.l||0),out='';
    var luck;
    if(S.expN){
      var exp=S.exp,act=S.w,diff=act-exp,mx=Math.max(S.expN,1);
      luck='<div class="card"><div class="eyebrow">Luck meter · expected vs actual wins</div><div class="big2 n">'+act+' <small class="mut">won</small> '+exp.toFixed(1)+' <small class="mut">expected</small></div>'+
        '<div class="luck"><div class="f" style="width:'+(exp/mx*100).toFixed(1)+'%"></div><div class="a" style="left:'+(act/mx*100).toFixed(1)+'%;background:'+(diff>=0?'var(--mint)':'var(--neg)')+'"></div></div>'+
        '<p class="note" style="margin:6px 0 0">'+(Math.abs(diff)<0.75?'Right on what the model expected. The results match the edge it saw.':diff>0?'<b class="pos">'+diff.toFixed(1)+' wins above</b> what the model expected. Running hot: some of this will give back.':'<b class="neg">'+Math.abs(diff).toFixed(1)+' wins below</b> what the model expected. That is the luck side, not proof the model is broken'+(S.expN<40?', especially over '+S.expN+' plays':'')+'.')+'</p>'+
        '<p class="note" style="margin:4px 0 0">Expected = the model’s hit chance on each play, added up. Over time, actual wins should track it. If they stay well below, the model is overrating its edge.</p></div>';
    }else luck='<div class="card"><div class="eyebrow">Luck meter</div><p class="note">Needs the model’s hit chance on graded plays. Replay rows don’t store it.</p></div>';
    var st=X.streaks||{},dd=X.drawdown||{};
    var streak='<div class="card"><div class="eyebrow">Streaks and drawdown</div>'+
      '<div class="kv"><span>Now</span><b class="'+(st.currentType==='HIT'?'pos':st.currentType==='MISS'?'neg':'')+'">'+(st.current?(st.currentType==='HIT'?'W':'L')+st.current:'—')+'</b></div>'+
      '<div class="kv"><span>Longest win streak</span><b>'+(st.bestW||0)+'</b></div><div class="kv"><span>Longest losing streak</span><b>'+(st.bestL||0)+'</b></div>'+
      '<div class="kv"><span>Biggest drop from a high'+(dd.from?' <span class="dim">('+esc(dayLabel(dd.from,{month:'short',day:'numeric'}))+(dd.to&&dd.to!==dd.from?'–'+esc(dayLabel(dd.to,{month:'short',day:'numeric'})):'')+')</span>':'')+'</span><b class="'+cls(dd.max)+'">'+units(dd.max)+'</b></div>'+
      '<div class="kv"><span>Below the high right now</span><b class="'+cls(dd.now)+'">'+(dd.now<0?units(dd.now):'at the high')+'</b></div>'+
      '<p class="note" style="margin:8px 0 0">Know what a normal rough patch looks like before changing the model in the middle of one.</p></div>';
    var c=X.close||{};
    var close='<div class="card"><div class="eyebrow">Near misses</div><div class="big2 n">'+(c.nearMiss||0)+'<small class="mut">of '+(c.misses||0)+' losses within 1</small></div>'+
      '<p class="note" style="margin:6px 0 8px">'+(c.nearWin||0)+' of '+(c.wins||0)+' wins were also within 1. Lots of close losses and few close wins means bad luck; losses by a mile mean bad picks.</p>'+
      (c.examples||[]).slice(0,4).map(function(x){return '<div class="mini"><span>'+esc(x.player)+' · '+esc(pickTxt(x.direction,x.line,x.stat))+'</span><span class="dim n">'+x.actual+' · '+esc(dayLabel(x.date,{month:'short',day:'numeric'}))+'</span></div>';}).join('')+'</div>';
    return '<section class="sec"><div class="sech"><h2>Luck or the model?</h2><span>'+dec+' decided plays</span></div><div class="g3">'+luck+streak+close+'</div></section>';
  }
  // P36: shadow ranking — same pool of qualifying props, two ways to rank.
  function shadowBlock(S){
    var head='<section class="sec"><div class="sech"><h2>Shadow ranking</h2><span>Test only · the real card is unchanged</span></div>';
    var expl='<p class="note">Every prop that qualified at lock, ranked two ways. <b>Current</b>: plays before leans, then the biggest edge. <b>Shadow</b>: edges count up to 20 pts, with a small bonus for better prices, so a huge edge no longer jumps to #1 on its own.</p>';
    if(!S||S.error||!S.lists||!S.days)return head+'<div class="card">'+expl+'<p class="note2">Starts filling after the first slate that locks with this update. Both cards are graded the next morning.</p></div></section>';
    var x=S.lists[state.list]||{},a=x.current||{},b=x.shadow||{},diff=(b.units||0)-(a.units||0);
    var row=function(lab,r,cl){return '<div class="kv"><span>'+lab+'</span><b class="n">'+wl(r)+' <span class="'+cls(r.units)+'" style="font-size:15px">'+units(r.units)+'</span></b></div>';};
    var verdict=!((a.w||0)+(a.l||0))?'Nothing graded yet.':Math.abs(diff)<0.5?'About even so far.':diff>0?'<b class="pos">Shadow ahead by '+diff.toFixed(2)+'u</b>':'<b class="neg">Current ahead by '+Math.abs(diff).toFixed(2)+'u</b>';
    var R=(S.recent||[]).filter(function(r){return r.list===state.list;}).slice(0,8);
    var diffs=R.length?R.map(function(r){return '<div class="mini"><span><span class="dim" style="display:inline-block;min-width:58px">'+(r.side==='shadow'?'Shadow':'Current')+' only</span> '+esc(r.player)+' · '+esc(pickTxt(r.direction,r.line,r.stat))+' <span class="dim">'+odds(r.odds)+' · edge '+pts(r.edge)+' · '+esc(dayLabel(r.date,{month:'short',day:'numeric'}))+'</span></span><span>'+(r.outcome?'<span class="oc '+esc(r.outcome)+'">'+esc(r.outcome)+'</span>':'')+'</span></div>';}).join(''):'<p class="note2">The two rankings picked the same plays so far.</p>';
    return head+'<div class="g2"><div class="card"><h3>'+esc(listName())+' · '+(x.days||0)+' day'+(x.days===1?'':'s')+'</h3>'+expl+row('Current ranking',a)+row('Shadow ranking',b)+
      '<p class="note" style="margin:8px 0 0">'+verdict+' '+(x.same||0)+' of '+(x.picks||0)+' shadow picks were also on the current card.</p></div>'+
      '<div class="card"><h3>Where they differ</h3><p class="note">Plays only one ranking picked. This is where the shadow wins or loses.</p>'+diffs+'</div></div></section>';
  }
  // P34: guard tracker (props held off the card only by a context guard).
  function guardBlock(G){
    if(!G||G.error||!G.all)return '';
    var a=G.all,dec=a.w+a.l;
    var verdict=!dec?'No blocked props have been graded yet.':a.units<0?'Blocked props went '+wl(a)+' ('+units(a.units)+'). The guards <b class="pos">saved '+Math.abs(a.units).toFixed(2)+'u</b> so far.':
      'Blocked props went '+wl(a)+' ('+units(a.units)+'). The guards <b class="neg">cost '+a.units.toFixed(2)+'u</b> so far'+(dec<THIN?', but it is a small sample':'')+'.';
    return '<section class="sec"><div class="sech"><h2>Guard tracker</h2><span>All lists · since '+esc(dayLabel(G.since,{month:'short',day:'numeric'}))+'</span></div><div class="g2">'+
      '<div class="card"><h3>Did the guards help?</h3><p class="note">Props that passed every other rule (grade, price, edge) but a context guard kept off the card, at the morning line. '+verdict+'</p>'+splitRows(G.byGuard.filter(function(r){return r.plays;}),true)+'</div>'+
      '<div class="card"><h3>Recently blocked</h3><p class="note">The most recent graded props a guard held off.</p>'+((G.recent||[]).length?G.recent.map(function(x){
        return '<div class="mini"><span>'+esc(x.player)+' · '+esc(pickTxt(x.direction,x.line,x.stat))+' <span class="dim">· '+esc(x.guard)+'</span></span><span><span class="oc '+esc(x.outcome)+'">'+esc(x.outcome)+'</span> <span class="dim n">'+(x.actual==null?'':x.actual)+'</span></span></div>';}).join(''):'<p class="note2">Nothing yet.</p>')+'</div></div></section>';
  }
  function viewPerformance(d){
    var eras=d.record.eras||{},E=eras[state.era]||{},R=(E.lists&&E.lists[state.list])||d.record,S=R.season||{},L7=R.last7||{};
    var note=state.era==='current'?'Plays made under the rules now in force ('+esc(E.version||'')+'). Starts fresh when ModelVersion changes.':state.era==='all'?'Every real play since tracking began.':
      'Not real plays: today’s rules replayed on each graded slate at that morning’s lines.'+(E.blockedCount?' Real plays these rules would have blocked: '+E.blockedCount+' ('+wl(E.blocked)+', '+units((E.blocked||{}).units)+').':'');
    var h='<div class="ph"><h1><small>'+esc(listName())+' · flat 1 unit</small>Record</h1><div class="chips">'+seg('era',ERAS,state.era)+seg('list',LISTS,state.list,true)+'</div></div>'+
      '<div class="bug"><div><div class="eyebrow">Season</div><div><span class="wl n">'+wl(S)+'</span><span class="uu n '+cls(S.units)+'">'+units(S.units)+'</span></div>'+spark(R.daily)+'<p class="eranote">'+note+'</p></div>'+
      '<div class="grid"><div><div class="k">Hit rate</div><div class="v n">'+pct(S.hitRate)+'</div></div><div><div class="k">ROI</div><div class="v n '+cls(S.roi)+'">'+(S.roi==null?'—':pct(S.roi))+'</div></div>'+
      '<div><div class="k">Last 7 days</div><div class="v n">'+wl(L7)+'</div></div><div><div class="k">Last 7 units</div><div class="v n '+cls(L7.units)+'">'+units(L7.units)+'</div></div></div></div>';
    var T=E.topRanked||(eras.all||{}).topRanked;
    if(T){h+='<section class="sec"><div class="sech"><h2>The #1 play each day</h2><span>Highest-ranked locked play on each list</span></div><div class="g3">'+['ALL','OVER','UNDER'].map(function(L){
      var x=T[L]||{record:{},days:[]},r=x.record||{};
      return '<div class="card top1"><div class="eyebrow">'+(L==='ALL'?'#1 overall':L==='OVER'?'#1 over':'#1 under')+' · '+(r.plays||0)+' days</div><div class="big n">'+wl(r)+'<small class="'+cls(r.units)+'">'+units(r.units)+'</small></div>'+
        '<div class="box" style="margin-top:10px">'+(x.days||[]).slice(0,5).map(resultRow).join('')+'</div></div>';}).join('')+'</div></section>';}
    var C=R.clv;
    var cr=function(lab,x){if(!x||!x.n)return '<div class="split"><span class="lab">'+lab+'</span><span class="r" style="text-align:left">No closing lines yet</span><span></span><span></span></div>';
      return '<div class="split"><span class="lab">'+lab+'</span><span class="r" style="text-align:left">Beat the close <b>'+(x.beatRate==null?'—':Math.round(x.beatRate*100)+'%')+'</b></span><span class="r n '+cls(x.avgLine)+'">'+(x.avgLine==null?'—':signed(x.avgLine,2))+'</span><span class="r n '+cls(x.avgPrice)+'">'+(x.avgPrice==null?'—':signed(x.avgPrice*100,1)+'%')+'</span></div>';};
    var X=R.extras||{};
    h+=luckBlock(S,X);
    if(C){var cx=X.byClvLock&&X.byClvLock.length?'<div class="subh">Record when we locked a better number than the close</div>'+splitRows(X.byClvLock):'';
      var cm=X.byClvMorning&&X.byClvMorning.length?'<div class="subh">Record when the morning line beat the close</div>'+splitRows(X.byClvMorning):'';
      h+='<section class="sec"><div class="g2"><div class="card"><h3>Closing line value</h3><p class="note">Did the line move our way by tip? Morning = first line seen vs the same book’s close. Lock = the line we locked vs the market close. If beating the close also wins more, the edge is real.</p>'+cr('Morning',C.morning)+cr('Lock',C.lock)+cx+cm+'</div>'+
        '<div class="card"><h3>Edge record</h3><p class="note">Bigger edges should win more if the edge means anything. The blue tick is the hit rate the model expected for that band.</p>'+legend(true)+splitRows(R.byEdge,true)+'</div></div></section>';}
    h+='<section class="sec"><div class="g2"><div class="card"><h3>By rank on the card</h3><p class="note">Do the #1–#2 plays carry the card, or do #4–#5 hold their own? If the bottom of the card loses, a shorter card is better.</p>'+splitRows(X.byRank,true)+'</div>'+
      '<div class="card"><h3>By price</h3><p class="note">Plays are allowed down to −130. If the −116 to −130 band loses, tighten the price limit.</p>'+splitRows(X.byOdds,true)+'</div></div></section>';
    h+=shadowBlock(d.shadow);
    h+=guardBlock(d.guards);
    h+='<section class="sec"><div class="g2"><div class="card"><h3>Over vs under</h3>'+legend(true)+splitRows(R.byDirection,true)+'</div><div class="card"><h3>By stat</h3><p class="note">Which markets are winning.</p>'+splitRows(R.byStat,true)+'</div>'+
      '<div class="card"><h3>By xEP grade</h3><p class="note">Plays only come from A+, A and A−.</p>'+splitRows(R.byGrade,true)+'</div><div class="card"><h3>Play vs lean</h3><p class="note">Plays need 10+ pts of edge, leans 6+.</p>'+splitRows(R.byDecision,true)+'</div></div></section>';
    var Cal=d.calibration||{};
    if(Cal.graded)h+='<section class="sec"><div class="sech"><h2>Is it working?</h2><span>Every prop on the board, not just plays · '+Cal.graded+' graded</span></div><div class="g3"><div class="card"><h3>By xEP grade</h3>'+splitRows(Cal.byGrade)+'</div><div class="card"><h3>By V2 edge</h3>'+splitRows(Cal.byEdge)+'</div><div class="card"><h3>Over vs under</h3>'+splitRows(Cal.byDirection)+'</div></div></section>';
    return h;
  }

  // ---- board ---------------------------------------------------------------
  function boardRows(d){
    var rows=d.board.rows.filter(function(r){if(state.boardStat!=='ALL'&&r.stat!==state.boardStat)return false;if(state.boardOnly&&!(r.decision==='PLAY'||r.decision==='LEAN'||r.decision==='WATCH'))return false;if(state.q&&(r.player+' '+r.game).toLowerCase().indexOf(state.q)===-1)return false;return true;});
    var k=state.sort.k,dir=state.sort.d;rows.sort(function(a,b){var x=a[k],y=b[k];if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*dir;});return rows;
  }
  function viewBoard(d){
    var cols=[['player','Player'],['stat','Stat'],['direction','Pick'],['line','Line'],['odds','Odds'],['book','Book'],['proj','Proj'],['edge','Edge'],['grade','Grade'],['l5','L5'],['l10avg','L10'],['matchup','Matchup'],['decision','Status']];
    var head='<tr>'+cols.map(function(c){var on=state.sort.k===c[0];return '<th data-k="'+c[0]+'">'+c[1]+(on?(state.sort.d>0?' ▲':' ▼'):'')+'</th>';}).join('')+'</tr>';
    var body=boardRows(d).map(function(r){return '<tr><td><img alt="" src="'+esc(r.teamLogo)+'" onerror="this.style.visibility=\'hidden\'">'+esc(r.player)+'</td><td>'+esc(r.stat)+'</td><td>'+esc(r.direction)+'</td><td class="n">'+(r.line==null?'—':r.line)+'</td><td class="n">'+odds(r.odds)+'</td><td>'+esc(r.book)+'</td><td class="n">'+(r.proj==null?'—':r.proj)+'</td><td class="n">'+pts(r.edge)+'</td><td>'+esc(r.grade)+'</td><td>'+esc(r.l5)+'</td><td class="n">'+(r.l10avg==null?'—':r.l10avg)+'</td><td>'+esc(words(r.matchup))+'</td><td class="'+esc(r.decision)+'" title="'+esc(r.reason)+'">'+esc(r.decision)+'</td></tr>';}).join('');
    return '<div class="ph"><h1><small>Every prop on tonight’s board</small>Board</h1></div><div class="bar">'+seg('stat',[['ALL','All'],['PTS','PTS'],['REB','REB'],['AST','AST'],['3PT','3PT']],state.boardStat)+
      '<div class="seg"><button id="onlyBtn" aria-pressed="'+state.boardOnly+'">Plays + watch</button></div><input class="search" id="q" type="search" placeholder="Search player or game" value="'+esc(state.q)+'"></div>'+
      '<div class="tablewrap"><table class="bt"><thead>'+head+'</thead><tbody>'+(body||'<tr><td colspan="13">No props match.</td></tr>')+'</tbody></table></div>';
  }

  // ---- render + wiring -----------------------------------------------------
  function render(){
    var d=state.data;if(!d)return;
    renderNav();renderStatus();
    var V={tonight:viewTonight,results:viewResults,players:viewPlayers,performance:viewPerformance,board:viewBoard}[state.view]||viewTonight;
    var app=document.getElementById('app');
    app.innerHTML=V(d)+'<p class="foot">'+esc(d.version||'')+' · Not betting advice. Plays are provisional and tracked for evaluation.</p>';
    state.entered=true;wire();setTimeout(function(){pollLive(false);},50);
  }
  function go(v){state.view=v;ls('ps_view',v);render();window.scrollTo(0,0);}
  function wire(){
    document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-go'));};});
    document.querySelectorAll('[data-list]').forEach(function(b){b.onclick=function(){state.list=b.getAttribute('data-list');ls('ps_list',state.list);state.open=null;render();};});
    document.querySelectorAll('[data-era]').forEach(function(b){b.onclick=function(){state.era=b.getAttribute('data-era');ls('ps_era',state.era);render();};});
    document.querySelectorAll('[data-date]').forEach(function(b){b.onclick=function(){state.date=b.getAttribute('data-date');render();};});
    var pd=document.getElementById('pickdate');if(pd)pd.onchange=function(){if(pd.value){state.date=pd.value;state.month=pd.value.slice(0,7);render();}};
    document.querySelectorAll('[data-month]').forEach(function(b){b.onclick=function(e){e.preventDefault();state.month=b.getAttribute('data-month');render();};});
    var cb=document.getElementById('calbox');if(cb)cb.ontoggle=function(){if(state.calOpen!==cb.open){state.calOpen=cb.open;ls('ps_cal',cb.open?'1':'');render();}};
    var rail=document.getElementById('rail');if(rail){var on=rail.querySelector('[aria-pressed="true"]');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center'});}
    document.querySelectorAll('[data-more]').forEach(function(b){b.onclick=function(){
      var k=b.getAttribute('data-more'),el=b.closest('.pc'),open=el.getAttribute('data-open')!=='true';
      document.querySelectorAll('.pc[data-open="true"]').forEach(function(o){if(o!==el)o.setAttribute('data-open','false');});
      state.open=open?k:null;el.setAttribute('data-open',open);
      if(open){var p=state.data.tonight.filter(function(x){return pkey(x)===k;})[0];if(p)el.querySelector('.detail').innerHTML=detail(p);}
    };});
    var pq=document.getElementById('pq');if(pq)pq.oninput=function(){state.pq=pq.value.toLowerCase();var pos=pq.selectionStart;render();var n=document.getElementById('pq');if(n){n.focus();n.setSelectionRange(pos,pos);}};
    document.querySelectorAll('[data-stat]').forEach(function(b){b.onclick=function(){state.boardStat=b.getAttribute('data-stat');render();};});
    var ob=document.getElementById('onlyBtn');if(ob)ob.onclick=function(){state.boardOnly=!state.boardOnly;render();};
    var q=document.getElementById('q');if(q)q.oninput=function(){state.q=q.value.toLowerCase();var pos=q.selectionStart;render();var n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(pos,pos);}};
    document.querySelectorAll('th[data-k]').forEach(function(th){th.onclick=function(){var k=th.getAttribute('data-k');state.sort=state.sort.k===k?{k:k,d:-state.sort.d}:{k:k,d:(k==='player'||k==='stat'?1:-1)};render();};});
  }
  document.getElementById('refresh').onclick=function(){if(!state.updating)load(true);};
  document.querySelector('.brand').onclick=function(){go('tonight');};

  // ---- live stat lines -----------------------------------------------------
  var liveAt=0,liveBusy=false;
  function liveTargets(){
    if(!state.data)return [];var now=Date.now();
    return state.data.tonight.filter(function(p){if(!p.espnGameId||!p.espnId||!p.tipIso||p.outcome)return false;return Date.parse(p.tipIso)-now<10*60000&&now-Date.parse(p.tipIso)<5*3600000;});
  }
  function paintLive(){
    if(state.view!=='tonight'||!state.data)return;
    state.data.tonight.forEach(function(p){var el=document.querySelector('.livebox[data-live="'+(window.CSS&&CSS.escape?CSS.escape(pkey(p)):pkey(p))+'"]');if(el)el.innerHTML=liveHtml(p);});
  }
  function pollLive(force){
    var t=liveTargets();if(!t.length||liveBusy)return;
    var allFinal=t.every(function(p){var g=state.live.games[p.espnGameId];return g&&g.state==='post';});
    if(!force&&Date.now()-liveAt<(allFinal?300000:30000))return;
    var g={},pl={};t.forEach(function(p){g[p.espnGameId]=1;pl[p.espnId]=1;});
    liveBusy=true;liveAt=Date.now();
    API.live(Object.keys(g).join(','),Object.keys(pl).join(','),function(d){liveBusy=false;if(d&&d.ok){state.live=d;paintLive();}});
  }
  setInterval(function(){if(document.visibilityState==='visible')pollLive(false);},5000);
  setInterval(function(){if(document.visibilityState==='visible'&&state.loadedAt&&Date.now()-state.loadedAt>10*60000)load();},60000);

  load();
})();
</script>
</body>
</html>
